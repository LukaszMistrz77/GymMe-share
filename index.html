<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Plan treningowy w GymMe</title>
<style>
  :root {
    --bg: #0f0e0c;
    --card: #1b1a17;
    --text: #f4efe6;
    --muted: #a9a294;
    --gold: #e9c46a;
    --gold-dark: #8a6a1f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border-radius: 16px;
    padding: 28px 22px;
    display: grid;
    gap: 16px;
    text-align: center;
  }
  h1 { margin: 0; font-size: 24px; line-height: 1.25; color: var(--gold); text-wrap: balance; }
  p { margin: 0; color: var(--muted); line-height: 1.5; }
  a.button {
    display: block;
    padding: 14px 16px;
    border-radius: 12px;
    border: 1.5px solid var(--gold);
    background: #000;
    color: var(--text);
    font-weight: 700;
    font-size: 16px;
    text-decoration: none;
  }
  a.button:focus-visible, a.link:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  a.link { color: var(--muted); font-size: 14px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1 data-pl="Ktoś udostępnił Ci plan treningowy" data-en="Someone shared a training plan with you">Ktoś udostępnił Ci plan treningowy</h1>
  <p id="status" data-pl="Otwieram w aplikacji GymMe…" data-en="Opening in the GymMe app…">Otwieram w aplikacji GymMe…</p>

  <!-- The app opened (the page was left in the meantime): the way back into it. -->
  <a id="open" class="button" href="#" hidden data-pl="Otwórz w aplikacji" data-en="Open in the app">Otwórz w aplikacji</a>

  <!-- The app did not open: the app is most likely not installed. -->
  <a id="store" class="button" href="#" hidden data-pl="Pobierz w Sklep Play" data-en="Get it on the Play Store">Pobierz w Sklep Play</a>
  <a id="have" class="link" href="#" hidden data-pl="Mam już aplikację — otwórz" data-en="I already have the app — open it">Mam już aplikację — otwórz</a>
</main>
<script>
  var params = new URLSearchParams(location.search);
  var token = (params.get('t') || '').replace(/[^A-Za-z0-9]/g, '').slice(0, 64);
  // v=dev: a link made by the development build of the app (for testing); it opens that build instead of the Play Store one.
  var isDev = params.get('v') === 'dev';
  var PACKAGE = isDev ? 'com.lukasz77.gymapp.dev' : 'com.lukasz77.gymapp';
  var SCHEME = isDev ? 'gymappdev' : 'gymapp';

  // The Play Store page of the app; the token travels as the install referrer, so the app can open the plan right after installing.
  var storeUrl = 'https://play.google.com/store/apps/details?id=' + PACKAGE +
    (token ? '&referrer=' + encodeURIComponent('share=' + token) : '');

  // An Android "intent" link: opens the app at the shared plan, and when the app is not installed Chrome follows the fallback to the
  // Play Store by itself.
  var openLink = token
    ? 'intent://share/' + token + '#Intent;scheme=' + SCHEME + ';package=' + PACKAGE +
      ';S.browser_fallback_url=' + encodeURIComponent(storeUrl) + ';end'
    : storeUrl;

  var el = function (id) { return document.getElementById(id); };
  el('open').href = openLink;
  el('have').href = openLink;
  el('store').href = storeUrl;

  if ((navigator.language || '').toLowerCase().indexOf('pl') !== 0) {
    document.documentElement.lang = 'en';
    document.querySelectorAll('[data-en]').forEach(function (node) { node.textContent = node.getAttribute('data-en'); });
    document.title = 'Training plan in GymMe';
  }

  // The page cannot tell whether the app is installed, so it tries to open it and looks at what happened: if the page was left, the
  // app (or the Play Store) took over; if the page is still in front a moment later, nothing opened — show the download button.
  var left = false;
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') {
      left = true;
    } else if (left) {
      el('status').hidden = true;
      el('store').hidden = true;
      el('have').hidden = true;
      el('open').hidden = false;
    }
  });

  setTimeout(function () {
    if (left) return;
    el('status').hidden = true;
    el('store').hidden = false;
    el('have').hidden = false;
  }, 1800);

  window.location.href = openLink;
</script>
</body>
</html>
